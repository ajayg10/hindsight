name: Deploy to Lightsail

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS Lightsail
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy to Lightsail
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST || '43.204.29.169' }}
          username: 'ubuntu'
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            cd ~/hindsight
            git pull origin main
            sudo DOMAIN=hindsight.agdev10.online docker compose -f docker-compose.prod.yml up -d --build
            sudo docker compose -f docker-compose.prod.yml exec -T web python seed/gen.py
            sudo docker compose -f docker-compose.prod.yml exec -T web python seed/tenants.py
