name: hindsight
services:
  falkordb:
    image: ${FALKORDB_IMAGE:-falkordb/falkordb:latest}
    restart: unless-stopped
    volumes:
      - graph-data:/data
    networks: [graph]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
  spikes:
    profiles: [verify]
    build:
      context: .
      dockerfile: backend/Dockerfile.spikes
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
      FALKORDB_IMAGE: ${FALKORDB_IMAGE:-falkordb/falkordb:latest}
    volumes:
      - ./docs:/work/docs
      - ./backend:/work/backend
      - ./seed:/work/seed
      - ./scripts:/work/scripts
      - ./eval:/work/eval
    networks: [graph]
    depends_on:
      falkordb:
        condition: service_healthy
    command: [python, scripts/phase0.py]
  seed:
    profiles: [seed]
    build:
      context: .
      dockerfile: backend/Dockerfile.spikes
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
    networks: [graph]
    depends_on:
      falkordb:
        condition: service_healthy
    command: ["sh", "-c", "python seed/gen.py && python seed/tenants.py"]
  web:
    restart: always
    build:
      context: .
      dockerfile: backend/Dockerfile.spikes
    ports:
      - "8000:8000"
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend:/work/backend
      - ./seed:/work/seed
      - ./scripts:/work/scripts
      - ./docs:/work/docs
      - ./frontend/out:/work/frontend/out
    networks: [graph]
    depends_on:
      falkordb:
        condition: service_healthy
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "backend"]
networks:
  graph:
volumes:
  graph-data:
